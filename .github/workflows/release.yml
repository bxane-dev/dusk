name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install
      - name: Test embedded browser link handling and ad blocking
        shell: pwsh
        run: |
          node scripts/test-online-fix-navigation.cjs
          node scripts/test-online-fix-adblock.cjs
          node scripts/test-online-fix-autoselect.cjs
          node scripts/test-background-download-ui.cjs
          node scripts/test-game-source-browser.cjs
          node scripts/test-browser-copy-link.cjs

      - name: Test native archive recognition and mirror handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional Windows signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.8.16 — Safer large-game extraction and multipart readiness
            
            ## Fixed
            - Browser-downloaded multi-volume RAR and 7z archives must **pass an actual 7-Zip integrity test** before Dusk treats them as complete; consecutive filenames alone no longer count.
            - Reject archives with duplicate volume numbers, noncontiguous parts, or parts that change while being tested.
            - Check available disk space **before** extraction through 7-Zip, the Windows ZIP extractor, or the Python fallback. Keep a 512 MiB free-space reserve.
            - Preserve the **150 GiB unpacked-size limit** introduced in v1.8.15, with 50,000-file and path/link safety limits.
            - Show specific progress when a multipart download is incomplete or needs an installed 7-Zip tool instead of repeatedly attempting a failing extraction.
            - Add regression tests for bogus multipart files, duplicate volumes, unpacked-size calculation and disk-space limits.
            
            ## Notes
            - Managed one-click bundles know their download completion status; browser-downloaded archives now require integrity verification before automatic import.
            - On Windows, automatic verification of browser-downloaded multipart archives needs 7-Zip available on the system.
            - Dusk cannot recover archive volumes that are missing or inaccessible from the file host, and continues to require approval before executing installers.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
