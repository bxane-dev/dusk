name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install
      - name: Test embedded browser link handling and ad blocking
        shell: pwsh
        run: |
          node scripts/test-online-fix-navigation.cjs
          node scripts/test-online-fix-adblock.cjs
          node scripts/test-online-fix-autoselect.cjs
          node scripts/test-background-download-ui.cjs
          node scripts/test-game-source-browser.cjs
          node scripts/test-browser-copy-link.cjs

      - name: Test native archive recognition and mirror handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional Windows signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.8.14 — Reliable multipart archive and mirror checks
            
            ## Fixes
            - Verify **every required RAR or 7z volume** before starting an automatic bundle download, not only the first and last.
            - Only retain mirrors confirmed to return archive data. Reject redirects to missing `/download` endpoints, HTML landing pages and HTTP errors.
            - Correct archive-header detection for later `.part04.rar`, `.part05.rar` and higher numbered volumes, which do not start with a RAR header.
            - Recognize first RAR volumes consistently across `.part1.rar`, `.part01.rar` and `.part001.rar` filenames.
            - If a verified link subsequently expires or the host rejects a transfer, open the original game listing inside Dusk for manual host-side steps, instead of repeatedly retrying a dead URL.
            - Add native Rust regression tests to the Windows build pipeline.
            
            ## Important
            - A hosting provider that returns **404**, requires login/CAPTCHA, or does not issue a working direct download cannot be forced to provide the file. Dusk will use another verified public mirror when available and otherwise open the original listing.
            - Some hosting providers reserve direct or bulk downloads for authenticated/premium accounts.
            - Dusk still requires your approval before running downloaded installers.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
