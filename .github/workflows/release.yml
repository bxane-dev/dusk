name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional Windows signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.6.11

            Windows app icon fix and Discord game-detection mitigation.

            ## What's new

            - Added optional Dusk Discord Rich Presence.
            - Discord RPC is disabled by default and only connects when explicitly enabled in Settings.
            - Users can configure a Discord Application ID for a dedicated Dusk launcher identity.
            - Presence states follow Dusk activity such as browsing the library, screenshots, achievements, settings, or launching a game.
            - Dusk clears and closes the IPC activity when Rich Presence is disabled.
            - Keeps the live crescent taskbar/window icon and DuskLauncher.exe process identity from v1.6.10.

            ## Notes

            Dusk does not automatically download or install games from unofficial redistribution sites. Local installers stay under your control, and official store links open in your default browser.

            The Windows installer is built from this public repository on GitHub Actions.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
