name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install
      - name: Test embedded browser link handling and ad blocking
        shell: pwsh
        run: |
          node scripts/test-online-fix-navigation.cjs
          node scripts/test-online-fix-adblock.cjs
          node scripts/test-online-fix-autoselect.cjs
          node scripts/test-background-download-ui.cjs
          node scripts/test-game-source-browser.cjs
          node scripts/test-browser-copy-link.cjs

      - name: Test native archive recognition and mirror handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional Windows signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.8.13 — Browser Copy link and Automatic VPN settings
            
            ## What's new
            - Added a **Copy link** button to Dusk's embedded game-listing and download-host browser windows. It copies the current page URL, including after navigation.
            - Added **Settings → VPN** with **Automatic** enabled by default and an Off option.
            - Detects Windows VPN profiles and uses the selected or sole existing profile, with connection status and a **Connect now** control.
            - Attempts to connect the configured Windows VPN at Dusk startup and before launching websites; credentials stay in Windows.
            - Added a shortcut to **Windows VPN settings** to create or manage VPN profiles.
            - Added regression coverage for the browser Copy link button.
            
            ## Important limitations
            - This is **Windows VPN integration**, not a bundled VPN service, endpoint, or server. A VPN account/server must already be configured in Windows.
            - If a VPN cannot connect, Dusk displays that it is disconnected; websites use the normal network connection. Windows VPN routing (including split tunneling) determines what traffic uses the tunnel.
            - Dusk does not bypass download hosts' authentication, CAPTCHA or access restrictions, and does not silently execute game installers.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
