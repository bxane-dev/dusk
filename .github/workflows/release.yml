name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install
      - name: Test embedded browser link handling and ad blocking
        shell: pwsh
        run: |
          node scripts/test-online-fix-navigation.cjs
          node scripts/test-online-fix-adblock.cjs
          node scripts/test-online-fix-autoselect.cjs
          node scripts/test-background-download-ui.cjs
          node scripts/test-game-source-browser.cjs

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional Windows signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/DuskLauncher.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.8.11 — One-click multi-source game downloads
            
            ## What's new
            - Added **Get game** to Game3rb and FitGirl listings for detectable direct archive links.
            - Detects alternative download mirrors for the same file and tries the next mirror if one fails.
            - Downloads recognized complete multipart **RAR** and **7z** volume sets with one click.
            - Expanded Online-Fix Hosters discovery to support multiple archive volumes.
            - Fixed the embedded Game3rb search fallback and allowed user-clicked links to recognized download hosts while blocking unrelated pop-ups.
            - Scans recent archives in Downloads subfolders (up to two levels deep) and imports supported archives into Dusk's managed-games directory.
            - Detects games after extraction when a single runnable game executable is identified; offers a confirmation before launching an extracted installer.
            - Shows this changelog in Dusk's **Settings → Updates** notice.
            
            ## Important limitations
            - Automatic downloading requires discoverable, direct public HTTPS archive URLs. File hosts that require login, CAPTCHA, torrents, or intermediate download steps may still need browser interaction.
            - Multipart archives must have every numbered volume; incomplete sets are not imported.
            - Untrusted installer execution is never silent: your approval is required. Some archives require 7-Zip or a supported extractor.
            - Background downloads and import require Dusk to remain open.
            - Windows SmartScreen may warn about installers without a trusted publisher signature.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
