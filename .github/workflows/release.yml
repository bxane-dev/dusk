name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - installer-build

concurrency:
  group: dusk-windows-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ vars.DUSK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DUSK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare Dusk branding
        run: npm run brand:prepare

      - name: Configure optional release signing
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json

          $hasUpdaterSigning = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -and -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)
          if ($hasUpdaterSigning) {
            $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $true -Force
            if ($null -eq $config.plugins) {
              $config | Add-Member -NotePropertyName plugins -NotePropertyValue ([pscustomobject]@{})
            }

            $libPath = 'src-tauri/src/lib.rs'
            $lib = Get-Content $libPath -Raw
            if ($lib -notmatch 'tauri_plugin_updater::Builder') {
              $lib = $lib.Replace(
                '    tauri::Builder::default()',
                "    tauri::Builder::default()`n        .plugin(tauri_plugin_updater::Builder::new().build())"
              )
              Set-Content $libPath $lib
            }

            $updater = [pscustomobject]@{
              pubkey = $env:TAURI_SIGNING_PUBLIC_KEY
              endpoints = @('https://github.com/bxanedot/dusk/releases/latest/download/latest.json')
              windows = [pscustomobject]@{ installMode = 'passive' }
            }
            $config.plugins | Add-Member -NotePropertyName updater -NotePropertyValue $updater -Force
            Write-Host 'Signed updater artifacts enabled.'
          } else {
            $config.bundle | Add-Member -NotePropertyName createUpdaterArtifacts -NotePropertyValue $false -Force
            Write-Host 'Updater signing keys not configured; building installer without updater artifacts.'
          }

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'dusk-code-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              $securePassword = New-Object System.Security.SecureString
            } else {
              $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            }
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            if ($null -eq $config.bundle.windows) {
              $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
            }
            $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
            $config.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
            $config.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
            Write-Host 'Windows Authenticode signing enabled.'
          } else {
            Write-Host 'Windows certificate not configured; installer will be unsigned by a trusted publisher certificate.'
          }

          $config | ConvertTo-Json -Depth 30 | Set-Content $path

      - name: Build release executable for startup test
        run: npm run tauri build -- --no-bundle

      - name: Smoke test release startup
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/dusk.exe'
          if (-not (Test-Path $exe)) { throw "Dusk executable was not produced." }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "Dusk exited during release startup test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Build and publish Dusk
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: dusk-v__VERSION__
          releaseName: Dusk v__VERSION__
          releaseBody: |
            # Dusk v1.6.0

            Dusk accounts, cross-device progress sync, and account-owned cloud saves.

            ## What's new

            - Added the official violet Dusk crescent/gamepad desktop logo across the title bar, sidebar, account screen, loading state, executable, shortcuts, and About panel.
            - Added a custom dark-violet NSIS installer with branded header/sidebar artwork plus matching installer and uninstaller icons.
            - Added custom Dusk login and registration.
            - Register with email, username, and password; sign in with username and password.
            - Added unique Supabase-backed Dusk accounts and persistent sessions.
            - Sync owner profiles, library membership, favorites, playtime, launch counts, collections, and active profile across devices.
            - Replaced anonymous per-install cloud identities with authenticated account-owned save storage.
            - Added safe cross-device merges while keeping executable and save-folder paths device-local.
            - Added account sign-out in Settings.
            - Added private Row Level Security policies for account state and save files.
            - Kept installer hub, game discovery, profiles, physical save vaults, updater, custom window controls, and controller navigation.

            ## Notes

            Dusk does not automatically download or install games from unofficial redistribution sites. Local installers stay under your control, and official store links open in your default browser.

            The Windows installer is built from this public repository on GitHub Actions.
          releaseDraft: false
          prerelease: false
